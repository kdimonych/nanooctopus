
[package]
publish = false
name = "raspberry_pico_w"
version = "0.3.0"
edition = "2024"

[dependencies]
# HTTP server
nanooctopus_server = { version = "0.3.3", default-features = false, path = "../../nanooctopus_server", package = "nanooctopus_server", features = [
  "defmt",
] }
edge-nal = { version = "0.7", default-features = false }
edge-nal-embassy = { version = "0.9" }

#-----------------------------------------------------------------------------#
# External dependencies
#-----------------------------------------------------------------------------#
cortex-m = "0.7"
cortex-m-rt = { version = "0.7", features = ["set-sp"] }
embedded-io-async = { version = "0.7", default-features = false, features = [
  "defmt",
] }
embedded-hal = "1.0"

# Debug logging
defmt = { version = "1", default-features = false }
defmt-rtt = { version = "1" }
panic-probe = { version = "1", features = ["print-defmt"] }
panic-halt = "1.0"
defmt-or-log = { version = "0.2.3", default-features = false, features = [
  "defmt",
] }

# Critical section and atomics for embedded
portable-atomic = { version = "1.11.1", features = ["critical-section"] }
critical-section = "1.2.0"
static_cell = "2.1.1"

# Embassy
embassy-embedded-hal = { version = "0.6", features = ["defmt"] }
embassy-executor = { version = "0.10", features = [
  "defmt",
  "platform-cortex-m",
  "executor-thread",
] }
embassy-time = { version = "0.5", features = [
  "defmt-timestamp-uptime",
  "defmt",
] }
embassy-rp = { version = "0.10", features = [
  "rp2040",
  "rt",
  "unstable-pac",
  "time-driver",
  "critical-section-impl",
  "intrinsics",
  "defmt",
  "rom-v2-intrinsics",
] }
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = [
  "tcp",
  "udp",
  "dhcpv4",
  "medium-ethernet",
  "defmt",
] }

# WiFi/bluetooth driver for the CYW43 chip on the Pico W
cyw43 = "0.7.0"
cyw43-pio = "0.10.0"
# Firmware for CYW43 (Needed to include firmware binary for the CYW43 chip used in raspberry Pi Pico W)
# TODO: change to a published version of the cyw43-firmware crate once it became available on crates.io
# PR: https://api.github.com/repos/KizzyCode/cyw43-firmware-rust/pulls/1
cyw43-firmware = { git = "https://github.com/kdimonych/cyw43-firmware-rust", branch = "nvram", features = [
  "wifi",
  "nvram",
] }

heapless = { version = "0.9", default-features = false, features = ["defmt"] }

[build-dependencies]
dotenvy = "0.15"
build_log = "0.1.0"
build_script_directives = "0.1.0"
memory_x_tools = "0.1.0"

[workspace]
members = ["."]

[profile.release]
debug = 2
